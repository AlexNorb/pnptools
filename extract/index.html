<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extract Images - PNP Buddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1990 12:00:00 GMT" />
    
    <link rel="icon" href="favicon.png" type="image/png" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,400&family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Tailwind v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Theme Configuration & Component Styles -->
    <style type="text/tailwindcss">
      @theme {
        --font-display: "Bungee", cursive, sans-serif;
        --font-body: "Averia Serif Libre", serif;
        --font-ui: "Inter", system-ui, -apple-system, sans-serif;
        --color-theme-bg: #ECF0DD;
        --color-theme-dark: #1C111F;
        --color-theme-muted: #554B59;
        --color-theme-pink: #DF2CD4;
        --color-theme-teal: #3DDDB2;
        --color-theme-yellow: #F7E517;
        --color-theme-indigo: #4E63C5;
        --color-theme-green: #9EEA84;
      }
      
      /* Bento Box */
      .bento-box {
        @apply bg-white border-3 border-theme-dark rounded-xl p-4 md:p-5 mb-5;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      
      /* Primary Button */
      .btn-primary {
        @apply bg-theme-yellow border-3 border-theme-dark font-ui font-bold px-5 py-2.5 rounded-xl transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-primary:hover:not(:disabled) {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-primary:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }
      .btn-primary:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Extract Button (Pink) */
      .btn-action-pink {
        @apply bg-theme-pink text-white font-display text-lg border-3 border-theme-dark rounded-xl px-5 py-2.5 transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-action-pink:hover:not(:disabled) {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-action-pink:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }
      .btn-action-pink:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }
      
      /* Secondary Button */
      .btn-secondary {
        @apply bg-white font-ui font-medium px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center cursor-pointer;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        box-sizing: border-box;
      }
      .btn-secondary:hover:not(:disabled) {
        @apply -translate-x-0.5 -translate-y-0.5;
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }
      .btn-secondary:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }
      .btn-secondary:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Neo Dropzone */
      .dropzone-neo {
        @apply border-2 border-dashed border-theme-dark bg-white rounded-lg p-4 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center min-h-[110px];
        box-shadow: 3px 3px 0 var(--color-theme-dark);
        position: relative;
      }
      .dropzone-neo:hover {
        @apply -translate-x-0.5 -translate-y-0.5 border-theme-pink;
        box-shadow: 4px 4px 0 var(--color-theme-pink);
      }
      
      /* Standardized Inputs & Disabled State */
      input[type="text"], input[type="number"], select {
        height: 2rem;
        border: 1.5px solid var(--color-theme-dark);
        @apply px-3 rounded-lg font-ui text-sm bg-white text-theme-dark transition-all duration-200;
      }
      input[type="text"]:focus, input[type="number"]:focus, select:focus {
        outline: none;
        border-color: var(--color-theme-pink);
        box-shadow: 0 0 0 2px rgba(223, 44, 212, 0.2);
      }
      input:disabled, select:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
      }
      
      /* Range Input Styling */
      input[type=range] {
        @apply accent-theme-pink h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer border-[1.5px] border-theme-dark;
      }
      input[type=range]::-webkit-slider-thumb {
        @apply appearance-none w-4 h-4 bg-theme-yellow border-2 border-theme-dark rounded-full cursor-pointer;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }

      /* Segmented Control Options */
      .segmented-option {
        @apply flex-1 text-center font-ui font-bold text-xs sm:text-sm rounded-[10px] transition-all duration-200 cursor-pointer flex items-center justify-center h-full;
      }
      .segmented-option:has(input:checked) {
        background-color: var(--color-theme-yellow);
        color: var(--color-theme-dark);
        border: 1.5px solid var(--color-theme-dark);
      }
      .segmented-option:not(:has(input:checked)) {
        color: var(--color-theme-muted);
        border: 2px solid transparent;
      }
      .segmented-option:not(:has(input:checked)):hover {
        background-color: rgba(0,0,0,0.05);
      }

      /* Neo-brutalist Checkbox */
      .neo-checkbox {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid var(--color-theme-dark);
        border-radius: 0.25rem;
        background-color: #ffffff;
        overflow: hidden;
        transition: background-color 0.2s ease;
        flex-shrink: 0;
      }
      .neo-checkbox:has(input:checked) {
        background-color: var(--color-theme-yellow);
      }
      .neo-checkbox input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        margin: 0;
        z-index: 10;
      }
      .neo-checkbox-icon {
        width: 0.75rem;
        height: 0.75rem;
        background-color: var(--color-theme-dark);
        opacity: 0;
        transition: opacity 0.2s ease;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      .neo-checkbox input:checked + .neo-checkbox-icon {
        opacity: 1;
      }
    </style>
    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-theme-bg font-ui text-theme-dark antialiased" data-tool-title="Extract Tool">
    
    <div class="max-w-6xl mx-auto px-4 py-6" id="page-container">
      
      <!-- Bento Box 1: Combined Workspace (Fluid 50/50% Auto-Wrapping) -->
      <div class="bento-box">
        <div class="flex flex-wrap items-stretch gap-6">
          <!-- Column 1: Upload PDF -->
          <div class="flex-1 min-w-[280px] flex flex-col">
            <h2 class="text-xl font-display text-theme-dark mb-2">1. Upload PDF</h2>
            <p class="text-xs text-theme-muted font-body mb-3 leading-relaxed">
              Extract all unique embedded images and graphics directly from your PDF file.
            </p>
            <div class="dropzone-neo relative flex-1 flex flex-col items-center justify-center p-4 min-h-[140px]" id="pdfDropzone">
              <i class="fa-solid fa-file-pdf text-4xl text-theme-pink mb-2"></i>
              <label for="fileInput" class="text-base font-bold cursor-pointer block text-theme-dark">Drop PDF here or browse</label>
              <span class="file-count text-xs block text-theme-muted mt-1 font-medium" id="status">No PDF loaded.</span>
              <input type="file" id="fileInput" accept="application/pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
            </div>
          </div>

          <!-- Column 2: Quick Action / Extract Status -->
          <div class="flex-1 min-w-[320px] flex flex-col justify-between pt-4 sm:pt-0 sm:pl-2">
            <div>
              <h2 class="text-xl font-display text-theme-dark mb-2">2. Extract</h2>
              <p class="text-xs text-theme-muted font-body mb-4 leading-relaxed">
                Click extract to process the document. Found images will be deduplicated automatically.
              </p>
              
              <!-- Progress Bar -->
              <div id="pageProgressBar" class="hidden mb-4">
                <div id="progressBarFill"></div>
              </div>
            </div>

            <button id="extractBtn" class="btn-action-pink w-full h-[52px] uppercase flex items-center justify-center gap-2 shrink-0" disabled>
              <i class="fa-solid fa-bolt text-lg"></i>
              Extract Images
            </button>
          </div>
        </div>
      </div>

      <!-- Bento Box 2: Advanced Configuration (Collapsible Accordion) -->
      <div class="bento-box p-0 overflow-hidden">
        <button id="toggleConfigBtn" class="w-full h-12 bg-gray-50 border-b-3 border-theme-dark flex items-center justify-between px-5 font-display text-sm cursor-pointer hover:bg-gray-100 transition-colors uppercase">
          <span><i class="fa-solid fa-sliders mr-2 text-theme-muted"></i> Advanced Configuration</span>
          <i class="fa-solid fa-chevron-down text-theme-muted"></i>
        </button>
        
        <div id="configContainer" class="hidden p-5 bg-white">
          <div class="flex flex-col gap-6">
            
            <!-- Row 1: Page Range & Format -->
            <div class="flex flex-wrap gap-6 items-start">
              <!-- Page Range -->
              <div class="flex-1 min-w-[260px]">
                <label class="block font-bold text-xs text-theme-dark uppercase tracking-wider mb-2">Page Range</label>
                <div class="flex items-center gap-3 h-8">
                  <label class="flex items-center gap-2 cursor-pointer text-sm font-medium shrink-0 select-none">
                    <div class="neo-checkbox">
                      <input type="checkbox" id="allPagesToggle" checked />
                      <div class="neo-checkbox-icon"></div>
                    </div>
                    All Pages
                  </label>
                  <input
                    type="text"
                    id="pageRangeInput"
                    placeholder="e.g., 1, 3, 5-9"
                    disabled
                    class="flex-1 min-w-0"
                  />
                </div>
              </div>

              <!-- Output Format -->
              <div class="flex-1 min-w-[240px]">
                <label class="block font-bold text-xs text-theme-dark uppercase tracking-wider mb-2">Output Format</label>
                <div class="flex p-0 bg-white border-2 border-theme-dark rounded-xl shadow-[2px_2px_0_var(--color-theme-dark)] gap-1 h-8 items-center w-full max-w-[240px]">
                  <label class="segmented-option">
                    <input type="radio" id="formatJpeg" name="outputFormat" value="image/jpeg" class="hidden" checked />
                    <span>JPG</span>
                  </label>
                  <label class="segmented-option">
                    <input type="radio" id="formatPng" name="outputFormat" value="image/png" class="hidden" />
                    <span>PNG</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Row 2: Quality & Options -->
            <div class="flex flex-wrap gap-6 items-start">
              
              <!-- Quality Control -->
              <div class="flex-1 min-w-[240px]">
                <label class="block font-bold text-xs text-theme-dark uppercase tracking-wider mb-2">JPEG Quality</label>
                <div class="flex items-center gap-3 h-8">
                  <input
                    id="quality"
                    type="range"
                    min="0.4"
                    max="1"
                    step="0.05"
                    value="1"
                    class="flex-1 max-w-[160px]"
                  />
                  <span id="qualityVal" class="text-sm font-bold w-10 text-theme-dark">1.00</span>
                </div>
              </div>

              <!-- Filters & Toggles -->
              <div class="flex-[2] min-w-[280px] flex flex-wrap gap-x-6 gap-y-3 pt-6 sm:pt-0">
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium select-none">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="ignoreSmallFiles" checked />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Ignore &lt;5KB
                </label>
                
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium select-none">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="safeModeToggle" />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Slow Mode
                </label>
                
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium select-none">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="debugModeToggle" />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Debug Mode
                </label>
              </div>
            </div>

            <!-- Row 3: Utilities -->
            <div class="flex gap-3 pt-4 border-t-2 border-dashed border-gray-200">
              <button id="clearBtn" class="btn-secondary" disabled>
                <i class="fa-solid fa-rotate-right mr-1.5 text-xs"></i> Clear All
              </button>
              <button id="clearLogBtn" class="btn-secondary">
                <i class="fa-solid fa-eraser mr-1.5 text-xs"></i> Clear Log
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- Bento Box 3: Action & Export Bar (3-to-1 Column Responsive Grid) -->
      <div id="resultsBar" class="bento-box grid grid-cols-1 md:grid-cols-[auto_1fr_170px] gap-4 items-stretch bg-theme-bg border-theme-dark mt-6 hidden">
        <!-- Column 1: Download All Button -->
        <button id="downloadZip" class="btn-primary text-lg h-[52px] md:h-full min-h-[52px] flex items-center justify-center gap-2 uppercase tracking-wide cursor-pointer shrink-0" disabled>
          <i class="fa-solid fa-file-zipper"></i>
          Save ZIP
        </button>

        <!-- Column 2: Status / Details Card -->
        <div class="w-full justify-self-stretch flex items-stretch justify-center h-full min-w-0">
          <div class="bg-white border-3 border-theme-dark rounded-xl py-2 px-4 flex items-center gap-3 shadow-[4px_4px_0_var(--color-theme-dark)] w-full h-full min-h-[52px]">
            <i class="fa-solid fa-images text-theme-pink text-lg shrink-0"></i>
            <span class="font-bold text-xs text-theme-dark shrink-0">Summary:</span>
            <span id="resultsSummaryText" class="font-bold text-xs text-theme-indigo truncate min-w-0 flex-1">0 images found</span>
          </div>
        </div>

        <!-- Column 3: Buy Me a Dice Link -->
        <a href="https://www.buymeacoffee.com/pnpbuddy" title="Support PnPBuddy by buying me a dice"
          class="w-full md:w-[170px] flex items-center justify-center border-3 border-theme-dark rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] overflow-hidden bg-[#f7e517] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] h-[52px] md:h-full min-h-[52px] p-1 shrink-0">
          <img
            src="https://img.buymeacoffee.com/button-api/?text=Buy me a dice&emoji=🎲&slug=pnpbuddy&button_colour=f7e517&font_colour=000000&font_family=Bree&outline_colour=000000&coffee_colour=FFDD00"
            alt="Buy me a dice" class="h-full w-full max-h-full max-w-full object-contain object-center" />
        </a>
      </div>

      <!-- Bento Box 4: Debug Log (Hidden by default) -->
      <div id="logContainer" class="bento-box hidden">
        <h2 class="font-display text-sm text-theme-dark mb-3 uppercase flex items-center gap-2"><i class="fa-solid fa-terminal text-theme-muted"></i> Debug Log</h2>
        <pre id="logOutput"></pre>
      </div>

      <!-- Bento Box 5: Image Gallery -->
      <div class="bento-box p-0 overflow-hidden bg-transparent border-0 shadow-none">
        <button id="toggleThumbsBtn" class="btn-secondary w-full h-12 uppercase font-display text-sm" disabled>
          Preview 0 images
        </button>
        <!-- Thumbnail Grid Container -->
        <div id="images" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-5"></div>
      </div>
      
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="../shared/notifications.js"></script>
    <script src="../shared/header.js"></script>
    <script src="extract.js"></script>
  </body>
</html>
