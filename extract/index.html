    <!-- Theme Configuration & Component Styles -->
    <style type="text/tailwindcss">
      @theme {
        --font-display: "Bungee", cursive, sans-serif;
        --font-body: "Averia Serif Libre", serif;
        --font-ui: "Inter", system-ui, -apple-system, sans-serif;
        --color-theme-bg: #ECF0DD;
        --color-theme-dark: #1C111F;
        --color-theme-muted: #554B59;
        --color-theme-pink: #DF2CD4;
        --color-theme-teal: #3DDDB2;
        --color-theme-yellow: #F7E517;
        --color-theme-indigo: #4E63C5;
        --color-theme-green: #9EEA84;
      }
      
      /* Bento Box */
      .bento-box {
        @apply bg-white border-3 border-theme-dark rounded-xl p-4 md:p-5 mb-5;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }

      /* Smooth Accordion Animation (Matching /layout) */
      .collapsible-wrapper {
        display: grid;
        grid-template-rows: 1fr;
        transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        opacity: 1;
      }
      .collapsible-wrapper.collapsed {
        grid-template-rows: 0fr;
        opacity: 0;
        pointer-events: none;
      }
      .collapsible-inner {
        overflow: hidden;
      }
      
      /* Primary Button */
      .btn-primary {
        @apply bg-theme-yellow border-3 border-theme-dark font-ui font-bold px-5 py-2.5 rounded-xl transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-primary:hover:not(:disabled) {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-primary:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }
      .btn-primary:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Extract Button (Pink) */
      .btn-action-pink {
        @apply bg-theme-pink text-white font-display text-lg border-3 border-theme-dark rounded-xl px-5 py-2.5 transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-action-pink:hover:not(:disabled) {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-action-pink:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }
      .btn-action-pink:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }
      
      /* Secondary Button */
      .btn-secondary {
        @apply bg-white font-ui font-medium px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center cursor-pointer;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        box-sizing: border-box;
      }
      .btn-secondary:hover:not(:disabled) {
        @apply -translate-x-0.5 -translate-y-0.5;
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }
      .btn-secondary:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }
      .btn-secondary:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Indigo Button */
      .btn-indigo {
        @apply bg-theme-indigo text-white font-ui font-bold px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center cursor-pointer;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        box-sizing: border-box;
      }
      .btn-indigo:hover:not(:disabled) {
        @apply -translate-x-0.5 -translate-y-0.5;
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }
      .btn-indigo:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }
      .btn-indigo:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Pink Button */
      .btn-pink {
        @apply bg-theme-pink text-white font-ui font-bold px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center cursor-pointer;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        box-sizing: border-box;
      }
      .btn-pink:hover:not(:disabled) {
        @apply -translate-x-0.5 -translate-y-0.5;
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }
      .btn-pink:active:not(:disabled) {
        @apply translate-x-0 translate-y-0;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }
      .btn-pink:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Custom Neo-Brutalist Checkbox matching /layout tool style */
      input[type="checkbox"]:not(.sr-only):not(.hidden) {
        appearance: none;
        -webkit-appearance: none;
        width: 1.25rem;
        height: 1.25rem;
        border: 1.5px solid var(--color-theme-dark);
        border-radius: 0.375rem;
        background-color: #ffffff;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        cursor: pointer;
        position: relative;
        transition: all 0.15s ease;
        display: inline-grid;
        place-content: center;
        margin: 0;
        vertical-align: middle;
        flex-shrink: 0;
      }

      input[type="checkbox"]:not(.sr-only):not(.hidden):hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }

      input[type="checkbox"]:not(.sr-only):not(.hidden):active {
        transform: translate(0px, 0px);
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }

      /* Bold checkmark icon */
      input[type="checkbox"]:not(.sr-only):not(.hidden)::before {
        content: "";
        width: 0.65rem;
        height: 0.65rem;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        background-color: #ffffff;
        transform-origin: center;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }

      input[type="checkbox"]:not(.sr-only):not(.hidden):checked::before {
        transform: scale(1);
      }

      /* Indigo fill when checked */
      input[type="checkbox"]:not(.hidden):checked {
        background-color: var(--color-theme-indigo);
      }

      /* Neo Dropzone */
      .dropzone-neo {
        @apply border-2 border-dashed border-theme-dark bg-white rounded-lg p-4 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center min-h-[110px];
        box-shadow: 3px 3px 0 var(--color-theme-dark);
        position: relative;
      }
      .dropzone-neo:hover {
        @apply -translate-x-0.5 -translate-y-0.5 border-theme-pink;
        box-shadow: 4px 4px 0 var(--color-theme-pink);
      }
      
      /* Standardized Inputs & Disabled State */
      input[type="text"], input[type="number"], select {
        height: 2rem;
        border: 1.5px solid var(--color-theme-dark);
        @apply px-3 rounded-lg font-ui text-sm bg-white text-theme-dark transition-all duration-200;
      }
      input[type="text"]:focus, input[type="number"]:focus, select:focus {
        outline: none;
        border-color: var(--color-theme-pink);
        box-shadow: 0 0 0 2px rgba(223, 44, 212, 0.2);
      }
      input:disabled, select:disabled {
        background-color: #E2E8F0 !important;
        color: var(--color-theme-muted) !important;
        border-color: rgba(28, 17, 31, 0.3) !important;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none !important;
      }
      
      /* Range Input Styling */
      input[type=range] {
        @apply accent-theme-pink h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer border-[1.5px] border-theme-dark;
      }
      input[type=range]::-webkit-slider-thumb {
        @apply appearance-none w-4 h-4 bg-theme-yellow border-2 border-theme-dark rounded-full cursor-pointer;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }

      /* Segmented Control Options */
      .segmented-option {
        @apply flex-1 text-center font-ui font-bold text-xs sm:text-sm rounded-[10px] transition-all duration-200 cursor-pointer flex items-center justify-center h-full;
      }
      .segmented-option:has(input:checked) {
        background-color: var(--color-theme-yellow);
        color: var(--color-theme-dark);
        border: 1.5px solid var(--color-theme-dark);
      }
      .segmented-option:not(:has(input:checked)) {
        color: var(--color-theme-muted);
        border: 2px solid transparent;
      }
      .segmented-option:not(:has(input:checked)):hover {
        background-color: rgba(0,0,0,0.05);
      }

      /* Neo-brutalist Checkbox */
      .neo-checkbox {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid var(--color-theme-dark);
        border-radius: 0.25rem;
        background-color: #ffffff;
        overflow: hidden;
        transition: background-color 0.2s ease;
        flex-shrink: 0;
      }
      .neo-checkbox:has(input:checked) {
        background-color: var(--color-theme-yellow);
      }
      .neo-checkbox input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        margin: 0;
        z-index: 10;
      }
      .neo-checkbox-icon {
        width: 0.75rem;
        height: 0.75rem;
        background-color: var(--color-theme-dark);
        opacity: 0;
        transition: opacity 0.2s ease;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      .neo-checkbox input:checked + .neo-checkbox-icon {
        opacity: 1;
      }
    </style>
    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="font-ui text-theme-dark antialiased min-h-screen" style="background: linear-gradient(155deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.35)), linear-gradient(155deg, rgba(78, 99, 197, 1) 0%, rgba(61, 221, 178, 1) 50%, rgba(223, 44, 212, 1) 100%); background-attachment: fixed;" data-tool-title="Extract Tool">
    
    <div class="max-w-6xl mx-auto px-4 py-6" id="page-container">
      
      <!-- Bento Box 1: Combined Upload & Settings (Fluid 50/50% Auto-Wrapping) -->
      <div class="bento-box">
        <div class="flex flex-wrap items-stretch gap-6">
          <!-- Column 1: Upload PDF -->
          <div class="flex-1 min-w-[280px] flex flex-col">
            <div class="flex items-center justify-between mb-4 gap-2">
              <h2 class="text-xl font-display text-theme-dark">1. Upload PDF</h2>
              <button type="button" id="clearPdfBtn" class="btn-secondary flex items-center gap-1.5 text-xs py-1 px-2.5" title="Clear loaded PDFs" disabled>
                <i class="fa-solid fa-trash-can text-xs text-theme-pink"></i>
                <span class="font-bold hidden sm:inline">Clear</span>
              </button>
            </div>
            <div class="dropzone-neo relative flex flex-col items-center justify-center p-6 flex-1 min-h-[140px]" id="pdfDropzone">
              <i class="fa-solid fa-file-pdf text-4xl text-theme-pink mb-2"></i>
              <label for="fileInput" class="text-base font-bold cursor-pointer block text-theme-dark text-center">Drop PDF(s) here or browse</label>
              <span class="file-count text-xs block text-theme-muted mt-1 font-medium text-center truncate max-w-full px-2" id="status">No PDF loaded.</span>
              <input type="file" id="fileInput" accept="application/pdf" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
            </div>

            <!-- Extract Button -->
            <button id="extractBtn" disabled class="bg-theme-indigo text-white font-display text-base border-3 border-theme-dark px-6 py-2.5 rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] w-full flex items-center justify-center tracking-wide h-11 mt-4 uppercase gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-x-0 disabled:hover:translate-y-0 disabled:hover:shadow-[4px_4px_0_var(--color-theme-dark)]">
              <i class="fa-solid fa-images"></i>
              Extract Images
            </button>
          </div>

          <!-- Column 2: Settings -->
          <div class="flex-1 min-w-[280px] flex flex-col pt-4 sm:pt-0">
            <h2 class="text-xl font-display text-theme-dark mb-4">2. Settings</h2>

            <!-- Extraction Format -->
            <div class="flex flex-col gap-2 mb-4">
              <label class="font-bold text-xs text-theme-dark uppercase tracking-wider block">Extraction Format:</label>
              <div class="flex p-0 bg-white border-2 border-theme-dark rounded-xl shadow-[2px_2px_0_var(--color-theme-dark)] gap-1 h-[2.5rem] items-center w-full max-w-sm">
                <label class="segmented-option cursor-pointer font-bold flex-1 h-full rounded-[10px] text-xs transition-all flex items-center justify-center px-2">
                  <input type="radio" id="formatOriginal" name="extractionMode" value="original" class="hidden" checked />
                  <span>Source</span>
                </label>
                <label class="segmented-option cursor-pointer font-bold flex-1 h-full rounded-[10px] text-xs transition-all flex items-center justify-center px-2">
                  <input type="radio" id="formatJpeg" name="extractionMode" value="jpeg" class="hidden" />
                  <span>JPG</span>
                </label>
              </div>
            </div>

            <!-- JPEG Quality (Visible only if JPEG conversion is selected) -->
            <div id="jpegQualityWrapper" class="hidden flex flex-col gap-1.5 mb-4">
              <label for="jpegQualitySelect" class="font-bold text-xs text-theme-dark uppercase tracking-wider block">JPEG Quality:</label>
              <select id="jpegQualitySelect" class="w-full max-w-xs text-xs font-bold text-theme-dark border-1.5 border-theme-dark rounded-lg h-8 px-3">
                <option value="1">100% (Maximum)</option>
                <option value="0.90" selected>90% (Recommended)</option>
                <option value="0.80">80% (High)</option>
                <option value="0.70">70% (Medium)</option>
              </select>
            </div>

            <!-- Naming Options -->
            <div class="flex items-center gap-2 mb-4">
              <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-theme-dark">
                <input type="checkbox" id="addUsageSuffix" checked class="accent-theme-indigo" />
                <span>Add usage count suffix (e.g. img_001_x4.jpg)</span>
              </label>
            </div>

            <!-- Page Selection -->
            <div class="flex flex-col gap-2 w-full">
              <label class="font-bold text-xs text-theme-dark uppercase tracking-wider block">Extract pages:</label>
              <div class="flex p-0 bg-white border-2 border-theme-dark rounded-xl shadow-[2px_2px_0_var(--color-theme-dark)] gap-1 h-[2.5rem] items-center w-full max-w-xs" id="pageRangeSegmented">
                <label class="segmented-option cursor-pointer font-bold flex-1 h-full rounded-[10px] text-xs sm:text-sm transition-all flex items-center justify-center px-3">
                  <input type="radio" id="allPagesToggle" name="pageMode" value="all" class="hidden" checked />
                  <span>All</span>
                </label>
                <label class="segmented-option cursor-pointer font-bold flex-1 h-full rounded-[10px] text-xs sm:text-sm transition-all flex items-center justify-center px-3">
                  <input type="radio" id="selectionPagesToggle" name="pageMode" value="selection" class="hidden" />
                  <span>Selection</span>
                </label>
              </div>
              <div class="w-full max-w-xs">
                <input type="text" id="pageRangeInput" placeholder="e.g. 1-3, 5, 8" disabled class="w-full text-xs font-bold text-theme-dark border-1.5 border-theme-dark rounded-lg h-8 px-3 focus:outline-none focus:border-theme-pink disabled:bg-[#E2E8F0] disabled:text-theme-muted disabled:border-theme-dark/30 disabled:opacity-70 disabled:cursor-not-allowed" />
              </div>
            </div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div id="pageProgressBar" class="hidden mt-4">
          <div id="progressBarFill"></div>
        </div>


      </div>

      <!-- Bento Box 3: Preview (Image Gallery matching /layout preview header) -->
      <div class="bento-box">
        <div class="flex items-center justify-between pb-3 mb-4 border-b-3 border-theme-dark gap-3 flex-wrap sm:flex-nowrap">
          <div class="flex items-center gap-3 shrink-0 flex-wrap sm:flex-nowrap">
            <h2 class="text-xl font-display text-theme-dark">3. Preview</h2>
            <span id="previewSummaryText" class="font-bold text-xs text-theme-indigo"></span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="toggleThumbsBtn"
              class="btn-indigo flex items-center gap-1.5 text-xs py-1 px-2.5" title="Toggle Preview Visibility" disabled>
              <span id="previewCollapseText" class="font-bold hidden sm:inline">Show</span>
              <i id="previewCollapseIcon" class="fa-solid fa-chevron-up transition-transform duration-200 text-xs" style="transform: rotate(180deg);"></i>
            </button>
          </div>
        </div>

        <div id="imagesContentWrapper" class="collapsible-wrapper collapsed">
          <div class="collapsible-inner">
            <!-- Thumbnail Grid Container -->
            <div id="images" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pt-1"></div>
          </div>
        </div>
      </div>

      <!-- Bento Box 4: Action & Export Bar (3-to-1 Column Responsive Grid) -->
      <div id="resultsBar" class="bento-box grid grid-cols-1 md:grid-cols-[auto_1fr_170px] gap-4 items-stretch bg-theme-bg border-theme-dark mt-6">
        <!-- Column 1: Save ZIP Button -->
        <button id="downloadZip" class="bg-theme-pink text-white font-display text-xl border-3 border-theme-dark px-6 py-3 rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] w-full flex items-center justify-center tracking-wide h-[52px] md:h-full min-h-[52px] uppercase gap-2 cursor-pointer shrink-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-x-0 disabled:hover:translate-y-0 disabled:hover:shadow-[4px_4px_0_var(--color-theme-dark)]" disabled>
          <i class="fa-solid fa-file-zipper"></i>
          Save ZIP
        </button>

        <!-- Column 2: Status / Details Card -->
        <div class="w-full justify-self-stretch flex items-stretch justify-center h-full min-w-0">
          <div class="bg-white border-3 border-theme-dark rounded-xl py-2 px-4 flex items-center gap-3 shadow-[4px_4px_0_var(--color-theme-dark)] w-full h-full min-h-[52px]">
            <i class="fa-solid fa-images text-theme-pink text-lg shrink-0"></i>
            <span class="font-bold text-xs text-theme-dark shrink-0">Summary:</span>
            <span id="resultsSummaryText" class="font-bold text-xs text-theme-indigo truncate min-w-0 flex-1">0 images found</span>
          </div>
        </div>

        <!-- Column 3: Buy Me a Dice Link -->
        <a href="https://www.buymeacoffee.com/pnpbuddy" title="Support PnPBuddy by buying me a dice"
          class="w-full md:w-[170px] flex items-center justify-center border-3 border-theme-dark rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] overflow-hidden bg-[#f7e517] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] h-[52px] md:h-full min-h-[52px] p-1 shrink-0">
          <img
            src="https://img.buymeacoffee.com/button-api/?text=Buy me a dice&emoji=🎲&slug=pnpbuddy&button_colour=f7e517&font_colour=000000&font_family=Bree&outline_colour=000000&coffee_colour=FFDD00"
            alt="Buy me a dice" class="h-full w-full max-h-full max-w-full object-contain object-center" />
        </a>
      </div>

      
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="../shared/notifications.js"></script>
    <script src="../shared/header.js"></script>
    <script src="extract.js"></script>
