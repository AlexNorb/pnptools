<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDF → Extract Unique Images</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,400&family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Tailwind v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Theme Configuration -->
    <style type="text/tailwindcss">
      @theme {
        --font-display: "Bungee", cursive, sans-serif;
        --font-body: "Averia Serif Libre", serif;
        --font-ui: "Inter", system-ui, -apple-system, sans-serif;
        --color-theme-bg: #ECF0DD;
        --color-theme-dark: #1C111F;
        --color-theme-muted: #554B59;
        --color-theme-pink: #DF2CD4;
        --color-theme-teal: #3DDDB2;
        --color-theme-yellow: #F7E517;
        --color-theme-indigo: #4E63C5;
        --color-theme-green: #9EEA84;
      }
      
      /* Bento Box */
      .bento-box {
        @apply bg-white border-3 border-theme-dark rounded-xl p-4 md:p-5 mb-5;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      
      /* Primary Button */
      .btn-primary {
        @apply bg-theme-yellow border-3 border-theme-dark font-ui font-bold px-5 py-2.5 rounded-xl transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary:not(:disabled):hover {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-primary:not(:disabled):active {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }

      /* Extract Button (Pink) */
      .btn-action-pink {
        @apply bg-theme-pink text-white font-display text-lg border-3 border-theme-dark rounded-xl px-5 py-2.5 transition-all duration-200 cursor-pointer;
        box-shadow: 4px 4px 0 var(--color-theme-dark);
      }
      .btn-action-pink:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-action-pink:not(:disabled):hover {
        @apply -translate-x-1 -translate-y-1;
        box-shadow: 6px 6px 0 var(--color-theme-dark);
      }
      .btn-action-pink:not(:disabled):active {
        @apply translate-x-0 translate-y-0;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
      }
      
      /* Secondary Button */
      .btn-secondary {
        @apply bg-white font-ui font-medium px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center cursor-pointer;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: 2px 2px 0 var(--color-theme-dark);
        box-sizing: border-box;
      }
      .btn-secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-secondary:not(:disabled):hover {
        @apply -translate-x-0.5 -translate-y-0.5;
        box-shadow: 3px 3px 0 var(--color-theme-dark);
      }
      .btn-secondary:not(:disabled):active {
        @apply translate-x-0 translate-y-0;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }
      
      /* Text Input */
      .text-input {
        @apply px-3 py-1 bg-white text-theme-dark font-ui text-sm rounded-lg transition-all duration-200;
        border: 1.5px solid var(--color-theme-dark);
        height: 2rem;
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);
      }
      .text-input:not(:disabled):focus {
        border-color: var(--color-theme-pink);
        box-shadow: 0 0 0 2px rgba(223, 44, 212, 0.2);
      }
      .text-input:disabled {
        opacity: 0.5;
        background-color: #f3f4f6;
      }
      
      /* Range Input Styling */
      input[type=range] {
        @apply accent-theme-pink h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer border-[1.5px] border-theme-dark;
      }
      input[type=range]::-webkit-slider-thumb {
        @apply appearance-none w-4 h-4 bg-theme-yellow border-2 border-theme-dark rounded-full cursor-pointer;
        box-shadow: 1px 1px 0 var(--color-theme-dark);
      }

      /* Segmented Control */
      .segmented-option {
        @apply flex-1 text-center font-ui font-semibold text-sm rounded-md transition-all duration-200 cursor-pointer flex items-center justify-center;
        height: 2rem;
      }
      .segmented-option:has(input:checked) {
        background-color: var(--color-theme-yellow);
        color: var(--color-theme-dark);
        border: 1.5px solid var(--color-theme-dark);
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
      }
      .segmented-option:not(:has(input:checked)) {
        color: var(--color-theme-muted);
        border: 2px solid transparent;
      }
      .segmented-option:not(:has(input:checked)):hover {
        background-color: rgba(0,0,0,0.05);
      }

      /* Neo-brutalist Checkbox */
      .neo-checkbox {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid var(--color-theme-dark);
        border-radius: 0.25rem;
        background-color: #ffffff;
        overflow: hidden;
        transition: background-color 0.2s ease;
        flex-shrink: 0;
      }
      .neo-checkbox:has(input:checked) {
        background-color: var(--color-theme-yellow);
      }
      .neo-checkbox input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        margin: 0;
        z-index: 10;
      }
      .neo-checkbox-icon {
        width: 0.75rem;
        height: 0.75rem;
        background-color: var(--color-theme-dark);
        opacity: 0;
        transition: opacity 0.2s ease;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      .neo-checkbox input:checked + .neo-checkbox-icon {
        opacity: 1;
      }
    </style>
    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-theme-bg font-ui text-theme-dark antialiased" data-tool-title="Extract Tool">
    
    <div class="max-w-6xl mx-auto px-4 py-6" id="page-container">
      
      <!-- Status & Progress Section -->
      <div class="mb-4">
        <div class="font-ui font-medium text-theme-muted mb-2 flex items-center min-h-[24px]" id="status">
          No PDF loaded.
        </div>
        <!-- Progress Bar -->
        <div id="pageProgressBar" class="hidden">
          <div id="progressBarFill"></div>
        </div>
      </div>

      <!-- Bento Box 1: Upload & Extract -->
      <div class="bento-box flex flex-col md:flex-row gap-4 items-center">
        <!-- Styled Dropzone/Upload Button -->
        <label for="fileInput" class="w-full md:flex-1 h-14 bg-white border-3 border-dashed border-theme-dark rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-gray-50 transition-colors font-display text-lg text-theme-dark relative overflow-hidden">
          <i class="fa-solid fa-file-pdf text-theme-pink"></i> SELECT PDF
          <input id="fileInput" type="file" accept="application/pdf" class="hidden" />
        </label>
        
        <!-- Extract Button -->
        <button id="extractBtn" class="btn-action-pink w-full md:w-auto h-14 uppercase" disabled>
          Extract Images
        </button>
      </div>

      <!-- Bento Box 2: Advanced Configuration -->
      <div class="bento-box p-0 overflow-hidden">
        <button id="toggleConfigBtn" class="w-full h-12 bg-gray-50 border-b-3 border-theme-dark flex items-center justify-between px-5 font-display text-sm cursor-pointer hover:bg-gray-100 transition-colors uppercase">
          Advanced Configuration <i class="fa-solid fa-chevron-down text-theme-muted"></i>
        </button>
        
        <div id="configContainer" class="hidden p-5 bg-white">
          <div class="flex flex-col gap-6">
            
            <!-- Row 1: Page Range & Format -->
            <div class="flex flex-col md:flex-row gap-6">
              <!-- Page Range -->
              <div class="flex-1">
                <label class="block font-display text-xs text-theme-muted mb-2 uppercase">Page Range</label>
                <div class="flex items-center gap-4 h-8">
                  <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
                    <div class="neo-checkbox">
                      <input type="checkbox" id="allPagesToggle" checked />
                      <div class="neo-checkbox-icon"></div>
                    </div>
                    All Pages
                  </label>
                  <input
                    type="text"
                    id="pageRangeInput"
                    placeholder="e.g., 1, 3, 5-9"
                    disabled
                    class="text-input flex-1 max-w-[200px]"
                  />
                </div>
              </div>

              <!-- Output Format -->
              <div class="flex-1">
                <label class="block font-display text-xs text-theme-muted mb-2 uppercase">Output Format</label>
                <div class="flex bg-gray-100 rounded-lg p-0.5 border-[1.5px] border-theme-dark shadow-[inset_1px_1px_3px_rgba(0,0,0,0.1)] h-9 w-full max-w-[250px]">
                  <label class="segmented-option">
                    <input type="radio" id="formatJpeg" name="outputFormat" value="image/jpeg" class="hidden" checked />
                    JPG
                  </label>
                  <label class="segmented-option">
                    <input type="radio" id="formatPng" name="outputFormat" value="image/png" class="hidden" />
                    PNG
                  </label>
                </div>
              </div>
            </div>

            <!-- Row 2: Filters, Modes & Quality -->
            <div class="flex flex-col md:flex-row gap-6 items-start">
              
              <!-- Quality Control -->
              <div class="flex-1">
                <label class="block font-display text-xs text-theme-muted mb-2 uppercase">JPEG Quality</label>
                <div class="flex items-center gap-3 h-8">
                  <input
                    id="quality"
                    type="range"
                    min="0.4"
                    max="1"
                    step="0.05"
                    value="1"
                    class="w-32"
                  />
                  <span id="qualityVal" class="text-sm font-bold w-10">1.00</span>
                </div>
              </div>

              <!-- Toggles -->
              <div class="flex-[2] flex flex-wrap gap-x-6 gap-y-3">
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="ignoreSmallFiles" checked />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Ignore &lt;5KB
                </label>
                
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="safeModeToggle" />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Slow Mode
                </label>
                
                <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
                  <div class="neo-checkbox">
                    <input type="checkbox" id="debugModeToggle" />
                    <div class="neo-checkbox-icon"></div>
                  </div>
                  Debug Mode
                </label>
              </div>
            </div>

            <!-- Row 3: Utilities -->
            <div class="flex gap-3 pt-4 border-t-2 border-dashed border-gray-200">
              <button id="clearBtn" class="btn-secondary" disabled>
                <i class="fa-solid fa-rotate-right mr-1.5 text-xs"></i> Clear All
              </button>
              <button id="clearLogBtn" class="btn-secondary">
                <i class="fa-solid fa-eraser mr-1.5 text-xs"></i> Clear Log
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- Bento Box 3: Results & Download (Hidden by default) -->
      <div id="resultsBar" class="bento-box bg-theme-teal/10 hidden">
        <button id="downloadZip" class="btn-primary w-full text-lg h-14 flex items-center justify-center gap-3" disabled>
          <i class="fa-solid fa-file-zipper"></i> Save all 0 images (~0.0 MB)
        </button>
      </div>

      <!-- Bento Box 4: Debug Log (Hidden by default) -->
      <div id="logContainer" class="bento-box hidden">
        <h2 class="font-display text-sm text-theme-dark mb-3 uppercase flex items-center gap-2"><i class="fa-solid fa-terminal text-theme-muted"></i> Debug Log</h2>
        <pre id="logOutput"></pre>
      </div>

      <!-- Bento Box 5: Image Gallery -->
      <div class="bento-box p-0 overflow-hidden bg-transparent border-0 shadow-none">
        <button id="toggleThumbsBtn" class="btn-secondary w-full h-12 uppercase font-display text-sm" disabled>
          Preview 0 images
        </button>
        <!-- Thumbnail Grid Container -->
        <div id="images" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-5"></div>
      </div>
      
      <!-- Footer -->
      <footer class="mt-8 pt-6 border-t-3 border-theme-dark flex flex-col md:flex-row items-center justify-between gap-4">
        <p class="font-body text-theme-muted text-sm max-w-lg text-center md:text-left">
          Runs entirely in your browser. Deduplication is based on the SHA-256 hash
          of the final content. Uses PDF.js and JSZip.
        </p>
        
        <!-- Buy Me a Coffee -->
        <a href="https://www.buymeacoffee.com/pnpbuddy" title="Support PnPBuddy"
          class="flex items-center justify-center border-3 border-theme-dark rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] overflow-hidden bg-[#f7e517] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] p-1 h-[52px]">
          <img src="https://img.buymeacoffee.com/button-api/?text=Buy me a dice&emoji=🎲&slug=pnpbuddy&button_colour=f7e517&font_colour=000000&font_family=Bree&outline_colour=000000&coffee_colour=FFDD00"
            alt="Buy me a dice" class="h-full w-full max-h-full max-w-full object-contain object-center" />
        </a>
      </footer>

    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="../shared/notifications.js"></script>
    <script src="../shared/header.js"></script>
    <script src="extract.js"></script>
  </body>
</html>
