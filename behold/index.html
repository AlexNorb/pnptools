<html lang="en">

  <!-- Beam Analytics -->
  <script
    src="https://beamanalytics.b-cdn.net/beam.min.js"
    data-token="251d0fd2-4c71-428b-a98c-d288098f0a61"
    async

  <script>
    function onHashChange() {
      const hash = window.location.hash;
      if (window.beam) {
        window.beam(`/custom-events/hashchange/${hash}`);
      }
    }
    window.addEventListener('hashchange', onHashChange, false);
  </script>
  <style>
    :root {
      --font-display: 'Bungee', cursive, sans-serif;
      --font-body: 'Averia Serif Libre', serif;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --border-dark: #1C111F;
      --accent-yellow: #F7E517;
      --accent-teal: #3DDDB2;
      --accent-pink: #DF2CD4;
      --accent-indigo: #4E63C5;
      --text-dark: #1C111F;
      --text-muted: #554B59;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ECF0DD;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-body);
      color: var(--text-dark);
    }
    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
    }
    .iframe-container {
      width: 100%;
      background: #FFFFFF;
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      box-shadow: 6px 6px 0 var(--border-dark), 10px 10px 0 var(--accent-pink);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 1380px;
      border: none;
      display: block;
    }
    .brand-footer {
      width: 100%;
      background: #FFFFFF;
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      box-shadow: 5px 5px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      text-align: center;
    }
    @media (min-width: 550px) {
      .brand-footer {
        flex-direction: row;
        text-align: left;
      }
    }
    .footer-brand-link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease;
    }
    .footer-brand-link:hover {
      transform: scale(1.02);
    }
    .footer-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .footer-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      line-height: 1.1;
      color: var(--text-dark);
      text-shadow: 2px 2px 0px var(--accent-pink);
    }
    .footer-tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    /* Colored Social Icons */
    .social-links {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 3px 3px 0 var(--border-dark);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .icon-discord {
      background: #5865F2;
      color: white;
    }
    .icon-discord:hover {
      transform: translate(-2px, -2px);
      background: #4752C4;
      box-shadow: 5px 5px 0 var(--border-dark), -2px -2px 0 var(--accent-pink);
    }
    .icon-makerworld {
      background: #00AE42;
      color: white;
    }
    .icon-makerworld:hover {
      transform: translate(-2px, -2px);
      background: #008F36;
      box-shadow: 5px 5px 0 var(--border-dark), -2px -2px 0 var(--accent-yellow);
    }
    .icon-bmc {
      background: var(--accent-yellow);
      color: var(--text-dark);
    }
    .icon-bmc:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--border-dark), -2px -2px 0 var(--accent-teal);
    }
    .icon-email {
      background: var(--accent-teal);
      color: var(--text-dark);
    }
    .icon-email:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--border-dark), -2px -2px 0 var(--accent-pink);
    }
  </style>
</head>
