<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="cache-control" content="max-age=0" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="expires" content="Tue, 01 Jan 1990 12:00:00 GMT" />
  <title>Align Tool - PNP Buddy</title>

  <link rel="icon" href="favicon.png" type="image/png" />

  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,400&family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-display: "Bungee", cursive, sans-serif;
      --font-body: "Averia Serif Libre", serif;
      --font-ui: "Inter", system-ui, -apple-system, sans-serif;
      --color-theme-bg: #ECF0DD;
      --color-theme-dark: #1C111F;
      --color-theme-muted: #554B59;
      --color-theme-pink: #DF2CD4;
      --color-theme-teal: #3DDDB2;
      --color-theme-yellow: #F7E517;
      --color-theme-indigo: #4E63C5;
      --color-theme-green: #9EEA84;
    }
    
    .bento-box {
      @apply bg-white border-3 border-theme-dark rounded-xl p-4 md:p-5 mb-5;
      box-shadow: 4px 4px 0 var(--color-theme-dark);
    }

    .btn-primary {
      @apply bg-theme-yellow border-3 border-theme-dark font-ui font-bold px-5 py-2.5 rounded-xl transition-all duration-200;
      box-shadow: 4px 4px 0 var(--color-theme-dark);
    }
    .btn-primary:hover {
      @apply -translate-x-1 -translate-y-1;
      box-shadow: 6px 6px 0 var(--color-theme-dark);
    }
    .btn-primary:active {
      @apply translate-x-0 translate-y-0;
      box-shadow: 2px 2px 0 var(--color-theme-dark);
    }

    .btn-secondary {
      @apply bg-white font-ui font-medium px-3 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center;
      border: 1.5px solid var(--color-theme-dark);
      height: 2rem;
      box-shadow: 2px 2px 0 var(--color-theme-dark);
      box-sizing: border-box;
    }
    .btn-secondary:hover {
      @apply -translate-x-0.5 -translate-y-0.5;
      box-shadow: 3px 3px 0 var(--color-theme-dark);
    }
    .btn-secondary:active {
      @apply translate-x-0 translate-y-0;
      box-shadow: 1px 1px 0 var(--color-theme-dark);
    }

    .segmented-option:has(input:checked) {
      background-color: var(--color-theme-yellow);
      color: var(--color-theme-dark);
      border: 1.5px solid var(--color-theme-dark);
    }
    .segmented-option:not(:has(input:checked)) {
      color: var(--color-theme-muted);
      border: 2px solid transparent;
    }

    input[type="number"], input[type="text"] {
      height: 2rem;
      border: 1.5px solid var(--color-theme-dark);
      @apply px-2 rounded-lg font-ui text-sm focus:outline-none focus:ring-2 focus:ring-theme-pink;
    }
  </style>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-theme-bg font-ui text-theme-dark antialiased" data-tool-title="Align Tool">
  <div class="max-w-6xl mx-auto px-4 py-6" id="page-container">
    
    <!-- Bento Box 1: Upload & Controls -->
    <div class="bento-box">
      <p class="font-body text-theme-muted text-lg text-center max-w-2xl mx-auto mb-6">
        This tool will shift (move) all content of every odd/even page.<br />
        Set the amount of millimeters you want to shift the content to the right/up.<br />
        Negative(-) numbers will shift it to the left/down instead.
      </p>

      <div class="flex flex-col items-center mb-8">
        <label for="pdfFile" class="btn-primary cursor-pointer flex items-center gap-2">
          <i class="fa-solid fa-upload"></i>
          Choose PDF File
        </label>
        <input type="file" id="pdfFile" accept="application/pdf" class="sr-only" />
      </div>

      <div class="flex flex-col md:flex-row justify-center gap-8 md:gap-12 items-center md:items-start">
        
        <!-- Left Column: Slider Pad -->
        <div class="flex-shrink-0 flex flex-col items-center">
          <div id="sliderPad" class="slider-pad w-[300px] h-[424px] bg-white border-3 border-theme-dark rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)]">
            <div id="sliderHandle" class="slider-handle w-[40px] h-[57px] bg-theme-indigo border-2 border-theme-dark rounded shadow-[2px_2px_0_var(--color-theme-dark)] transition-transform duration-75"></div>
          </div>
        </div>

        <!-- Right Column: Shift Inputs & Page Selection -->
        <div class="flex flex-col gap-6 w-full max-w-xs">
          
          <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between gap-4">
              <label for="shiftX" class="font-bold whitespace-nowrap">Shift Right (X):</label>
              <div class="flex items-center gap-2">
                <input type="number" id="shiftX" value="0" step="0.5" class="w-20 text-center" />
                <span class="text-theme-muted text-sm font-medium">mm</span>
              </div>
            </div>

            <div class="flex items-center justify-between gap-4">
              <label for="shiftY" class="font-bold whitespace-nowrap">Shift Up (Y):</label>
              <div class="flex items-center gap-2">
                <input type="number" id="shiftY" value="0" step="0.5" class="w-20 text-center" />
                <span class="text-theme-muted text-sm font-medium">mm</span>
              </div>
            </div>
          </div>

          <!-- Segmented Control for Pages -->
          <div class="flex bg-theme-bg p-1 rounded-xl border-3 border-theme-dark shadow-[inset_2px_2px_0_rgba(0,0,0,0.1)]">
            <label class="segmented-option flex-1 text-center py-2 rounded-lg font-bold text-sm cursor-pointer transition-all duration-200">
              <input type="radio" id="odd" name="shiftPages" value="odd" class="sr-only" checked />
              Odd pages
            </label>
            <label class="segmented-option flex-1 text-center py-2 rounded-lg font-bold text-sm cursor-pointer transition-all duration-200">
              <input type="radio" id="even" name="shiftPages" value="even" class="sr-only" />
              Even pages
            </label>
          </div>

        </div>
      </div>
    </div>

    <!-- Bento Box 2: Action Bar -->
    <div class="bento-box">
      <div class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-4 items-stretch">
        <button id="shiftPdfBtn" class="bg-theme-pink text-white font-display text-xl border-3 border-theme-dark px-6 py-3 rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] active:translate-x-0 active:translate-y-0 active:shadow-[2px_2px_0_var(--color-theme-dark)] transition-all duration-200 uppercase flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrows-up-down-left-right"></i>
          Shift PDF
        </button>

        <a href="https://www.buymeacoffee.com/pnpbuddy" title="Support PnPBuddy"
          class="flex items-center justify-center border-3 border-theme-dark rounded-xl shadow-[4px_4px_0_var(--color-theme-dark)] overflow-hidden bg-[#f7e517] transition-all duration-200 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_var(--color-theme-dark)] p-1 h-[52px]">
          <img src="https://img.buymeacoffee.com/button-api/?text=Buy me a dice&emoji=🎲&slug=pnpbuddy&button_colour=f7e517&font_colour=000000&font_family=Bree&outline_colour=000000&coffee_colour=FFDD00"
            alt="Buy me a dice" class="h-full w-full max-h-full max-w-full object-contain object-center" />
        </a>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.js"></script>
  <script src="../shared/notifications.js"></script>
  <script src="../shared/header.js"></script>
  <script src="align.js"></script>
</body>
</html>
